function classifyChapter(ch, mode=method){
  const recs=ch.topics.filter(knownCount);
  const ratings=new Map();
  const positives=recs.filter(t=>t.questionCount>0);
  const total=positives.reduce((s,t)=>s+t.questionCount,0);
  const valueGroups=[...new Set(positives.map(t=>t.questionCount))].sort((a,b)=>b-a).map(value=>({value,items:positives.filter(t=>t.questionCount===value)}));

      else if(share!==null && share>=shareImportant){stars=3;tier='medium';reason=`${share.toFixed(1)}% of this chapter's sum of numeric visible subtotals; important threshold is ${shareImportant}%.`;}
      else {stars=1;tier='low';reason=`${share===null?'No positive subtotal exists in this chapter':share.toFixed(1)+'% of this chapter\'s sum of numeric visible subtotals'}, below the important threshold.`;}
    }else if(mode==='manual'){

      else if(t.questionCount>=manualImportant){stars=3;tier='medium';reason=`Visible subtotal ${t.questionCount} meets the manually configured important threshold (${manualImportant}) but not the high-yield threshold.`;}
      else {stars=1;tier='low';reason=`Visible subtotal ${t.questionCount} is below the manually configured important threshold (${manualImportant}).`;}
    }else{
      if(valueGroups.length===1){
        if(positives.length===1){stars=5;tier='high';reason='The only positive-count topic in this chapter; assigned the top relative tier because there is no within-chapter competitor.';}
        else {stars=3;tier='medium';reason='All positive-count topics are tied; kept together at 3 stars because the chapter has no meaningful relative separation.';}
      }else if(valueGroups.length===2){
        if(t.questionCount===valueGroups[0].value){stars=5;tier='high';reason='Highest of two distinct positive-count levels in this chapter; tied topics stay together.';}
        else {stars=1;tier='low';reason='Lower of two distinct positive-count levels in this chapter; no unsupported middle group is manufactured.';}
      }else if(valueGroups.length>=3){

        const highTarget=Math.max(1,Math.ceil(positives.length*0.20));
        let highSize=0, highBoundary=null;

        const mediumTarget=Math.max(1,Math.ceil(positives.length*0.30));
        let mediumSize=0, mediumBoundary=null;
        for(const g of afterHigh){mediumBoundary=g.value;mediumSize+=g.items.length;if(mediumSize>=mediumTarget)break;}
        if(t.questionCount>=highBoundary){stars=5;tier='high';reason='Top-frequency band (adaptive top-20% target; tied counts expand the boundary) within this chapter.';}
        else if(mediumBoundary!==null && t.questionCount>=mediumBoundary){stars=3;tier='medium';reason='Middle-frequency band (next adaptive band; tied counts stay together) within this chapter.';}
        else {stars=1;tier='low';reason='Remaining lower-frequency band within this chapter; ties are kept together.';}

displayed subtotals',formatNum(totalVisible),'Not a unique exam-question total')}</section><div class="notice" role="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg><div><strong>Read the counts with the source limitation in mind</strong><p>The source is a scanned six-page PDF. The tables do not explain blank cells, and the International Affairs table includes a merged 2019–24 column. Figures in this app are visible-entry subtotals pending proofread against a clearer copy.</p></div></div><div class="section-head"><div><h2>Choose a section</h2><p>Open a chapter to sort, filter, compare and inspect every listed topic.</p></div><span class="tag">${filtered.length} sections shown</span></div><div class="chapter-grid" id="chapterGrid">${filtered.length?filtered.map(chapterCard).join(''):'<div class="empty-state" style="grid-column:1/-1"><strong>No matching sections</strong>Try a different chapter or topic search.</div>'}</div><section><div class="section-head" style="margin-top:31px"><div><h2>How the star ratings work</h2><p>Ratings are study-priority estimates based on historical printed counts, not predictions.</p></div></div><div class="legend-grid">${legendItem('★★★★★','High Yield Important','5 stars · highest relative band in the selected chapter')}${legendItem('★★★☆☆','Important','3 stars · middle frequency band or configured threshold')}${legendItem('★☆☆☆☆','Lower Priority','1 star · lower positive-frequency band')}${legendItem('☆☆☆☆☆','No Questions Recorded','0 stars only for an explicitly numeric zero; blanks are never treated as zero')}</div></section>`;bindGlobalSearch();app.querySelectorAll('[data-open-chapter]').forEach(el=>el.addEventListener('click',()=>openChapter(el.dataset.openChapter)));}
function legendItem(stars,title,copy){return `<div class="legend-item"><div class="legend-stars" aria-label="${stars.length} star positions">${stars}</div><strong>${title}</strong><span>${copy}</span></div>`;}
function bindGlobalSearch(){const input=$('#globalSearch');if(input){input.addEventListener('input',e=>{globalSearch=e.target.value;const pos=e.target.selectionStart;renderHome();const next=$('#globalSearch');next.focus();next.setSelectionRange(pos,pos);});}}
function openChapter(id){activeChapterId=id;viewName='chapter';topicSearch='';sortMode='source';topicFilter='all';chartShowAll=false;renderChapter();window.scrollTo({top:0,behavior:'smooth'});}
function renderChapter(){const ch=getChapter();if(!ch){renderHome();return;}viewName='chapter';currentTopics=ch.topics;currentRatings=classifyChapter(ch);const met=getChapterMetrics(ch);const highShare=met.known?Math.round((met.high/met.known)*100):0;app.innerHTML=`<section class="view"><div class="breadcrumb"><button type="button" id="crumbHome">Overview</button><span>›</span><span>${escapeHtml(ch.name)}</span></div><div class="chapter-heading"><div><div class="eyebrow"><span class="dot"></span> Source page ${ch.sourcePage} · ${escapeHtml(ch.language)}</div><h1>${escapeHtml(ch.name)}</h1><p>${escapeHtml(ch.tableDescription)} · Ratings are calculated independently within this section.</p></div><div class="chapter-actions"><button class="btn" id="exportCsv">↓ Export chapter CSV</button><button class="btn" id="printChapter">Print report</button></div></div><div class="notice" role="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg><div><strong>Visible subtotals, not guaranteed complete totals</strong><p>${escapeHtml(ch.notes.join(' '))} Classification is useful for comparing the entries shown in this chapter, but unresolved cells may change the result.</p></div></div><div class="chapter-stats">${chapterStat('Topics listed',met.totalTopics,'All source topic rows')}${chapterStat('Sum of visible subtotals',formatNum(met.subtotal),'May exclude unreported cells')}${chapterStat('High-yield rows',`${met.high} (${highShare}%)`,'5-star rows among numeric subtotals')}${chapterStat('Unknown / zero rows',`${met.unknown} / ${met.zero}`,'Unknown counts are excluded; zeros are not inferred')}</div><div class="analysis-grid"><section class="panel"><h2>Historical-frequency distribution</h2><div class="sub">Bars use the summed numerals visible for each topic. The source scan’s blank and merged cells are not imputed.</div><div id="chartMount" class="chart-scroll"></div><div class="chart-footer"><span id="chartNote">Top topics by visible subtotal</span><button type="button" class="btn small ghost" id="toggleChart">Show all topics</button></div></section><section class="panel settings-panel"><h2>Classification settings</h2><div class="sub">Changing the method recalculates this chapter’s ratings from its visible subtotals.</div><div class="settings-grid"><div class="field"><label for="methodSelect">Rating method</label><select id="methodSelect"><option value="adaptive" ${method==='adaptive'?'selected':''}>Adaptive chapter-wise</option><option value="share" ${method==='share'?'selected':''}>Percentage of chapter subtotal</option><option value="manual" ${method==='manual'?'selected':''}>Manual count thresholds</option></select></div><div class="field"><label for="sortSelect">Sort topics</label><select id="sortSelect"><option value="source" ${sortMode==='source'?'selected':''}>Original PDF order</option><option value="count-desc" ${sortMode==='count-desc'?'selected':''}>Highest count first</option><option value="count-asc" ${sortMode==='count-asc'?'selected':''}>Lowest count first</option><option value="importance" ${sortMode==='importance'?'selected':''}>Highest importance first</option><option value="alpha" ${sortMode==='alpha'?'selected':''}>Alphabetical</option></select></div></div><div class="settings-extra ${method==='manual'?'':'hidden'}" id="manualControls"><div class="field"><label for="manualHigh">High-yield min subtotal</label><input id="manualHigh" type="number" min="1" max="999999" value="${manualHigh}"></div><div class="field"><label for="manualImportant">Important min subtotal</label><input id="manualImportant" type="number" min="1" max="999998" value="${manualImportant}"></div></div><div class="settings-extra ${method==='share'?'':'hidden'}" id="shareControls"><div class="field"><label for="shareHigh">High-yield min share (%)</label><input id="shareHigh" type="number" min="0.1" max="100" step="0.5" value="${shareHigh}"></div><div class="field"><label for="shareImportant">Important min share (%)</label><input id="shareImportant" type="number" min="0" max="99.9" step="0.5" value="${shareImportant}"></div></div><div class="settings-note" id="methodNote">${methodNote()}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn small" id="resetSettings">Reset method settings</button><button class="btn small ghost" id="resetFilters">Clear filters</button></div></section></div><div class="table-tools"><div><h2>Topic Importance Analysis</h2><div class="small-note">${ch.topics.length} source rows · tap a topic for rating rationale and source reference</div></div><div class="filters"><label class="sr-only" for="topicSearch">Search topics in current chapter</label><input type="search" id="topicSearch" value="${escapeHtml(topicSearch)}" placeholder="Search this chapter…"><label class="sr-only" for="filterSelect">Filter topics by tier</label><select id="filterSelect"><option value="all" ${topicFilter==='all'?'selected':''}>All topics</option><option value="5" ${topicFilter==='5'?'selected':''}>★★★★★ High Yield</option><option value="3" ${topicFilter==='3'?'selected':''}>★★★ Important</option><option value="1" ${topicFilter==='1'?'selected':''}>★ Lower Priority</option><option value="0" ${topicFilter==='0'?'selected':''}>0 stars / zero recorded</option><option value="unknown" ${topicFilter==='unknown'?'selected':''}>Unknown count</option></select></div></div><div class="filter-status" id="filterStatus"></div><div class="topic-list" id="topicList"></div><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px"><span class="small-note">Study checklist is session-only and never changes source data.</span><button class="btn" id="exportJson">↓ Download full dataset JSON</button></div></section>`;
  drawChart(); renderTopicList(); bindChapterControls();
}
function chapterStat(label,value,foot){return `<div class="chapter-stat"><div class="label">${label}</div><div class="value">${value}</div><div class="small-note">${foot}</div></div>`;}
function methodNote(){if(method==='share')return `Topic share = a topic’s visible subtotal ÷ the sum of numeric visible subtotals in this chapter. This is not a percentage of all actual exam questions. Current cutoffs: ${shareHigh}% high-yield, ${shareImportant}% important.`;if(method==='manual')return `5 stars at or above ${manualHigh}; 3 stars at or above ${manualImportant}; 1 star below that. A numeric zero remains 0 stars. Keep the high threshold above the important threshold for sensible bands.`;return 'Adaptive ranking considers only numeric visible subtotals in this chapter. It targets the top 20% for 5 stars, the next band for 3, and the remaining positive counts for 1; tied counts stay together. Very small/tied distributions use a documented fallback.';}
function drawChart(){const ch=getChapter();if(!ch)return;const valid=ch.topics.filter(knownCount).sort((a,b)=>b.questionCount-a.questionCount||a.sourceOrder-b.sourceOrder);const data=chartShowAll?valid:valid.slice(0,10);const mount=$('#chartMount');if(!mount)return;if(!data.length){mount.innerHTML='<div class="chart-empty">No numeric subtotals are available to chart.</div>';return;}const max=Math.max(1,...data.map(t=>t.questionCount));const rowH=34,top=12,left=260,right=55,height=top+data.length*rowH+12,width=850,plotW=width-left-right;let svg=`<svg class="chart-svg" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" role="img" aria-label="Historical visible subtotal by topic, largest first">`;for(let i=0;i<=4;i++){const x=left+plotW*i/4;svg+=`<line x1="${x}" y1="${top-4}" x2="${x}" y2="${height-10}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${x}" y="${height-1}" text-anchor="middle" fill="var(--muted)" font-size="10">${Math.round(max*i/4)}</text>`;}data.forEach((t,i)=>{const y=top+i*rowH;const w=Math.max(2,plotW*t.questionCount/max);const label=t.name.length>34?t.name.slice(0,31)+'…':t.name;svg+=`<text x="${left-10}" y="${y+13}" text-anchor="end" fill="var(--text)" font-size="11">${escapeHtml(label)}</text><rect x="${left}" y="${y}" width="${w}" height="19" rx="5" fill="var(--accent)" opacity=".86"/><text x="${Math.min(left+w+7,width-25)}" y="${y+13}" fill="var(--text)" font-size="11" font-weight="700">${formatNum(t.questionCount)}</text>`;});svg+='</svg>';mount.innerHTML=svg;$('#chartNote').textContent=chartShowAll?`Showing all ${valid.length} numeric subtotals`:`Showing the top ${data.length} of ${valid.length} numeric subtotals`;$('#toggleChart').textContent=chartShowAll?'Show top 10':'Show all topics';$('#toggleChart').disabled=valid.length<=10;}
function ratingExplanation(t,r){if(!knownCount(t))return 'No rating is assigned because the source does not support a reliable numeric subtotal for this row.';if(t.questionCount===0)return 'A numeric zero is honored only when explicitly recorded; a blank source cell is not converted into zero.';return r?.reason||'Relative rating based on visible subtotals in this chapter.';}
function applyFiltersAndSort(){const ch=getChapter();if(!ch)return[];let arr=[...ch.topics];const q=topicSearch.trim().toLocaleLowerCase();if(q)arr=arr.filter(t=>t.name.toLocaleLowerCase().includes(q)||t.id.toLowerCase().includes(q));arr=arr.filter(t=>{const r=currentRatings.get(t.id);if(topicFilter==='all')return true;if(topicFilter==='unknown')return !knownCount(t);if(topicFilter==='0')return knownCount(t)&&t.questionCount===0;if(topicFilter==='5')return r?.stars===5;if(topicFilter==='3')return r?.stars===3;if(topicFilter==='1')return r?.stars===1;return true;});arr.sort((a,b)=>{const ra=currentRatings.get(a.id),rb=currentRatings.get(b.id);switch(sortMode){case'count-desc':return (knownCount(b)?b.questionCount:-Infinity)-(knownCount(a)?a.questionCount:-Infinity)||a.sourceOrder-b.sourceOrder;case'count-asc':return (knownCount(a)?a.questionCount:Infinity)-(knownCount(b)?b.questionCount:Infinity)||a.sourceOrder-b.sourceOrder;case'importance':return (ra?.stars??-1)===(rb?.stars??-1)?((knownCount(b)?b.questionCount:-1)-(knownCount(a)?a.questionCount:-1)||a.sourceOrder-b.sourceOrder):((rb?.stars??-1)-(ra?.stars??-1));case'alpha':return a.name.localeCompare(b.name);default:return a.sourceOrder-b.sourceOrder;}});return arr;}
function renderTopicList(){const ch=getChapter();if(!ch)return;currentRatings=classifyChapter(ch);visibleTopics=applyFiltersAndSort();const list=$('#topicList');if(!list)return;const studies=getStudyMap();$('#filterStatus').textContent=`Showing ${visibleTopics.length} of ${ch.topics.length} source topics${topicFilter!=='all'||topicSearch.trim()?' · filters active':''} · method: ${method==='adaptive'?'Adaptive chapter-wise':method==='share'?'Percentage of chapter subtotal':'Manual thresholds'}.`;if(!visibleTopics.length){list.innerHTML=`<div class="empty-state"><strong>No topics match these filters</strong>Try another search or clear filters. Unknown and blank source data are kept separate from zero-question topics.</div>`;return;}list.innerHTML=visibleTopics.map(t=>{const r=currentRatings.get(t.id);const star=starText(r?.stars);const stars=r?.stars;const cls=r?.tier||'unknown';const count=knownCount(t)?formatNum(t.questionCount):'Not established';const details=ratingExplanation(t,r);const rank=knownCount(t)?`Visible-subtotal rank #${1+ch.topics.filter(x=>knownCount(x)&&x.questionCount>t.questionCount).length}`:'Not ranked';const share=r?.share===null||r?.share===undefined?'':` · ${r.share.toFixed(1)}% of summed visible subtotals`;return `<article class="topic-row" data-topic-row="${escapeHtml(t.id)}"><div class="topic-main"><div class="topic-name ${ch.language==='বাংলা'?'bn':''}">${escapeHtml(t.name)}</div><div class="topic-meta"><span>PDF p. ${t.sourcePage}</span><span>·</span><span>${rank}${share}</span><span>·</span>${statusTag(t)}</div><div class="topic-explainer">${escapeHtml(details)}</div><label class="plan-check"><input type="checkbox" data-study-topic="${escapeHtml(t.id)}" ${studies[t.id]?'checked':''}><span>Mark as studied</span></label></div><div class="count-block"><div class="count">${count}</div><div class="count-caption">${knownCount(t)?'printed-entry subtotal':'not converted to zero'}</div><button type="button" class="topic-detail-link" data-topic-detail="${escapeHtml(t.id)}">View topic details ↗</button></div><div class="rating-block"><div class="stars" aria-label="${escapeHtml(star.aria)}">${stars===null?'':`<span>${'★'.repeat(stars)}</span><span class="empty">${'☆'.repeat(5-stars)}</span>`}</div><span class="rating-label ${cls}">${tierLabel(cls)}</span></div></article>`;}).join('');
list.querySelectorAll('[data-topic-detail]').forEach(el=>el.addEventListener('click',()=>showTopicDetail(el.dataset.topicDetail)));
list.querySelectorAll('[data-study-topic]').forEach(el=>el.addEventListener('change',()=>{setStudy(el.dataset.studyTopic,el.checked);const y=window.scrollY;renderTopicList();window.scrollTo(0,y);}));
}
function bindChapterControls(){const on=(sel,ev,fn)=>{const el=$(sel);if(el)el.addEventListener(ev,fn);};on('#crumbHome','click',renderHome);on('#methodSelect','change',e=>{method=e.target.value;renderChapter();});on('#sortSelect','change',e=>{sortMode=e.target.value;renderTopicList();});on('#topicSearch','input',e=>{topicSearch=e.target.value;renderTopicList();});on('#filterSelect','change',e=>{topicFilter=e.target.value;renderTopicList();});on('#toggleChart','click',()=>{chartShowAll=!chartShowAll;drawChart();});on('#resetSettings','click',()=>{method='adaptive';manualHigh=10;manualImportant=4;shareHigh=15;shareImportant=5;renderChapter();});on('#resetFilters','click',()=>{topicSearch='';topicFilter='all';sortMode='source';renderChapter();});on('#exportCsv','click',()=>exportChapterCsv());on('#exportJson','click',()=>downloadJson());on('#printChapter','click',()=>window.print());on('#manualHigh','change',e=>{manualHigh=clampInt(e.target.value,1,999999,10);if(manualImportant>=manualHigh)manualImportant=Math.max(1,manualHigh-1);renderChapter();});on('#manualImportant','change',e=>{manualImportant=clampInt(e.target.value,1,999998,4);if(manualImportant>=manualHigh)manualHigh=manualImportant+1;renderChapter();});on('#shareHigh','change',e=>{shareHigh=clampNum(e.target.value,0.1,100,15);if(shareImportant>=shareHigh)shareImportant=Math.max(0,shareHigh-0.5);renderChapter();});on('#shareImportant','change',e=>{shareImportant=clampNum(e.target.value,0,99.9,5);if(shareImportant>=shareHigh)shareHigh=Math.min(100,shareImportant+0.5);renderChapter();});
  app.querySelectorAll('[data-open-chapter]').forEach(el=>el.addEventListener('click',()=>openChapter(el.dataset.openChapter)));
}
function clampInt(value,min,max,fallback){const n=Number.parseInt(value,10);return Number.isFinite(n)?Math.min(max,Math.max(min,n)):fallback;}
function clampNum(value,min,max,fallback){const n=Number(value);return Number.isFinite(n)?Math.min(max,Math.max(min,n)):fallback;}
function showTopicDetail(topicId){const ch=getChapter();const t=ch?.topics.find(x=>x.id===topicId);if(!t)return;const r=classifyChapter(ch).get(t.id);activeModalTopic=t;const st=starText(r?.stars);$('#dialogTitle').textContent=t.name;const sum=knownCount(t)?formatNum(t.questionCount):'Unknown';$('#dialogBody').innerHTML=`<div class="modal-facts"><div class="modal-fact"><span>Visible printed subtotal</span><strong>${sum}</strong></div><div class="modal-fact"><span>Current classification</span><strong>${tierLabel(r?.tier||'unknown')}</strong></div><div class="modal-fact"><span>Star rating</span><strong>${st.aria}</strong></div><div class="modal-fact"><span>Source reference</span><strong>PDF page ${t.sourcePage}</strong></div></div><p><strong style="color:var(--text)">Why this rating?</strong><br>${escapeHtml(ratingExplanation(t,r))}</p><p><strong style="color:var(--text)">Data handling</strong><br>${escapeHtml(t.note)}</p><p><strong style="color:var(--text)">Method</strong><br>${escapeHtml(methodNote())}</p><p class="small-note">This rating estimates relative study priority from visible historical entries. It does not predict or guarantee future questions.</p>`;const d=$('#topicDialog');if(typeof d.showModal==='function')d.showModal();else d.setAttribute('open','');}
function closeDialog(){const d=$('#topicDialog');if(typeof d.close==='function')d.close();else d.removeAttribute('open');}
function downloadFile(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"';}
function exportChapterCsv(){const ch=getChapter();if(!ch)return;const ratings=classifyChapter(ch);const header=['chapter','topic','visibleSubtotal','countStatus','stars','importance','sourcePage','countBasis','note'];const rows=ch.topics.map(t=>{const r=ratings.get(t.id);return[ch.name,t.name,knownCount(t)?t.questionCount:'',t.countStatus,r?.stars??'',tierLabel(r?.tier||'unknown'),t.sourcePage,t.countBasis,t.note];});const csv='\ufeff'+[header,...rows].map(row=>row.map(csvCell).join(',')).join('\r\n');downloadFile(`${ch.id}_topic_analysis.csv`,csv,'text/csv;charset=utf-8');}
function downloadJson(){downloadFile('Medical_Admission_High_Yield_Analyzer_data.json',JSON.stringify(RAW_DATA,null,2),'application/json;charset=utf-8');}
function renderAudit(){viewName='audit';activeChapterId=null;const all=RAW_DATA.chapters.flatMap(c=>c.topics);const numeric=all.filter(knownCount);const unresolved=all.filter(t=>!knownCount(t));app.innerHTML=`<section class="view"><button class="back-link" id="auditBack">← Back to overview</button><div class="eyebrow"><span class="dot"></span> Source and extraction audit</div><h1 style="font-size:clamp(27px,3vw,38px);margin-top:10px">What the PDF supports — and what it doesn’t.</h1><p class="hero-copy">This report is embedded so the source limitations travel with the standalone HTML file.</p><div class="notice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg><div><strong>Audit status: provisional visual transcription</strong><p>All three tables were visually inspected, but the values have not been fully reconciled to a clearer original or publisher source. The application intentionally does not claim that all numerical totals are fully verified.</p></div></div><div class="audit-grid"><div class="audit-stat"><strong>${RAW_DATA.chapters.length}</strong><span>Sections extracted</span></div><div class="audit-stat"><strong>${all.length}</strong><span>Topic rows extracted</span></div><div class="audit-stat"><strong>${numeric.length}</strong><span>Numeric visible subtotals</span></div><div class="audit-stat"><strong>${unresolved.length}</strong><span>Unresolved counts</span></div></div><section class="audit-section"><h2>Coverage by source page</h2><div style="overflow:auto"><table class="audit-table"><thead><tr><th>Section</th><th>Page</th><th>Topic rows</th><th>Numeric subtotals</th><th>Sum of visible subtotals</th></tr></thead><tbody>${RAW_DATA.chapters.map(c=>`<tr><td><strong>${escapeHtml(c.name)}</strong><br><span class="small-note">${escapeHtml(c.tableDescription)}</span></td><td>${c.sourcePage}</td><td>${c.topics.length}</td><td>${c.numericTopicCount}</td><td>${formatNum(c.visibleSubtotalSum)}</td></tr>`).join('')}</tbody></table></div><p class="small-note" style="margin-top:12px">Sums are provided as arithmetic checks only. They are not asserted to be unique examination questions or publisher totals.</p></section><section class="audit-section"><h2>Extraction decisions</h2><ul>${SOURCE_AUDIT.limitations.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></section><section class="audit-section"><h2>Classification logic</h2><ul>${SOURCE_AUDIT.methodSummary.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul><p>Ratings are calculated at runtime separately for the selected chapter. They are not written into the source dataset, and changing the method does not alter counts.</p></section><section class="audit-section"><h2>Data validation and quality checks</h2><ul>${SOURCE_AUDIT.qualityChecks.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul><p><strong style="color:var(--text)">Checks performed:</strong> ${SOURCE_AUDIT.qualityChecks.length} declared data/logic checks plus runtime assertions for duplicate IDs, negative counts, and unresolved values. Automated algorithm edge-case tests were executed separately; this file does not imply that browser automation was performed.</p><button class="btn" id="auditDownload">Download audit JSON</button> <button class="btn" id="auditDataDownload">Download dataset JSON</button></section><section class="audit-section"><h2>Topic rows needing extra care</h2><ul>${unresolved.map(t=>{const c=RAW_DATA.chapters.find(ch=>ch.topics.includes(t));return `<li><strong>${escapeHtml(t.name)}</strong> — ${escapeHtml(c.name)}, PDF page ${t.sourcePage}: numeric count remains unknown and is excluded from rankings.</li>`}).join('')||'<li>No null counts are currently unresolved. Counts remain provisional because the source scan has unexplained blanks and merged cells.</li>'}</ul></section></section>`;$('#auditBack').addEventListener('click',renderHome);$('#auditDownload').addEventListener('click',()=>downloadFile('Medical_Admissi // Integrity checks on the embedded source dataset.
(function validateDataset(){const ids=new Set();const errors=[];for(const c of RAW_DATA.chapters){if(!Array.isArray(c.topics))errors.push(`Missing topic list in ${c.id}`);for(const t of c.topics){const k=c.id+'/'+t.id;if(ids.has(k))errors.push(`Duplicate ID: ${k}`);ids.add(k);if(t.questionCount!==null&&(!Number.isInteger(t.questionCount)||t.questionCount<0))errors.push(`Invalid count: ${k}`);if(!t.sourcePage)errors.push(`Missing source page: ${k}`);}}if(errors.length){console.error('Dataset integrity errors',errors);throw new Error(errors.join('; '));}})();

// Edge-case self-checks; results are available in window.__ANALYZER_QA__ for inspection.
function runAlgorithmTests(){const cases=[
 {name:'single positive topic',ch:{id:'t1',topics:[{id:'a',questionCount:3,sourceOrder:1}]},expect:[5]},
 {name:'all equal positive counts',ch:{id:'t2',topics:[{id:'a',questionCount:2,sourceOrder:1},{id:'b',questionCount:2,sourceOrder:2},{id:'c',questionCount:2,sourceOrder:3}]},expect:[3,3,3]},
 {name:'zero always zero stars',ch:{id:'t3',topics:[{id:'a',questionCount:0,sourceOrder:1},{id:'b',questionCount:4,sourceOrder:2}]},expectZero:0},
 {name:'unknown excluded',ch:{id:'t4',topics:[{id:'a',questionCount:null,sourceOrder:1},{id:'b',questionCount:4,sourceOrder:2}]},expectUnknown:null},
 {name:'large counts remain finite',ch:{id:'t5',topics:[{id:'a',questionCount:1000000,sourceOrder:1},{id:'b',questionCount:2,sourceOrder:2},{id:'c',questionCount:1,sourceOrder:3}]},expectFinite:true},
 {name:'method switch remains chapter scoped',ch:{id:'t6',topics:[{id:'a',questionCount:12,sourceOrder:1},{id:'b',questionCount:5,sourceOrder:2},{id:'c',questionCount:1,sourceOrder:3}]},expectModes:true}
];let passed=0;const results=[];for(const cs of cases){try{const r=classifyChapter(cs.ch,'adaptive');let ok=true;if(cs.expect)ok=cs.expect.every((v,i)=>r.get(cs.ch.topics[i].id)?.stars===v);if(cs.expectZero!==undefined)ok=r.get('a')?.stars===0;if(cs.expectUnknown!==undefined)ok=r.get('a')?.stars===null;if(cs.expectFinite)ok=[...r.values()].every(v=>v.stars===null||Number.isFinite(v.stars));if(cs.expectModes){const hi=classifyChapter(cs.ch,'manual').get('a').stars;const share=classifyChapter(cs.ch,'share').get('a').stars;ok=hi===5&&[1,3,5].includes(share);}results.push({name:cs.name,passed:ok});if(ok)passed++;}catch(e){results.push({name:cs.name,passed:false,error:String(e)});}}return {passed,total:cases.length,results};}
window.__ANALYZER_QA__=runAlgorithmTests();
renderHome();
